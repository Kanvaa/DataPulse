<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>⚡ DataPulse Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/style.css" />

      /* Ensure clean background during WebAssembly loading screen */
      body {
        background-color: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "plotly", "openpyxl"],
          entrypoint: "app.py",
          files: {
            "cleaner.py": "import pandas as pd\nimport numpy as np\nfrom typing import Tuple, Dict, Any\n\ndef clean_data(df: pd.DataFrame) -> Tuple[pd.DataFrame, Dict[str, Any]]:\n    \"\"\"\n    Cleans the input DataFrame:\n    - Removes duplicate rows\n    - Standardizes column names (lowercase, stripped)\n    - Parses and formats date columns\n    - Normalizes text values (strips whitespace, Title Case)\n    - Imputes missing values (median for numeric, 'Unknown' for categorical)\n    \n    Returns the cleaned DataFrame and a dictionary of cleaning statistics.\n    \"\"\"\n    stats = {}\n    stats['initial_rows'] = len(df)\n    \n    # 1. Standardize column names\n    df.columns = [col.strip().lower() for col in df.columns]\n    \n    # 2. Handle duplicates\n    dup_count = df.duplicated().sum()\n    df = df.drop_duplicates().reset_index(drop=True)\n    stats['duplicates_removed'] = int(dup_count)\n    \n    # 3. Handle Dates\n    # Detect date column (usually containing 'date')\n    date_cols = [col for col in df.columns if 'date' in col]\n    stats['date_cols_formatted'] = date_cols\n    for col in date_cols:\n        # Convert to datetime, coercion turns invalid parsed dates to NaT\n        df[col] = pd.to_datetime(df[col], errors='coerce')\n        # If any dates are NaT, we can forward fill or drop. Let's fill with today's date or drop.\n        # Dropping is safer if we want high-quality reports, or we can fill with a default value.\n        # Let's drop rows where date is completely missing.\n        missing_dates = df[col].isna().sum()\n        if missing_dates > 0:\n            df = df.dropna(subset=[col]).reset_index(drop=True)\n        # Format as string YYYY-MM-DD\n        df[col] = df[col].dt.strftime('%Y-%m-%d')\n        \n    # 4. Handle text columns\n    text_cols = ['product', 'category']\n    for col in text_cols:\n        if col in df.columns:\n            # Fill missing text with 'Unknown'\n            missing_text_count = df[col].isna().sum()\n            df[col] = df[col].fillna('Unknown').astype(str)\n            df[col] = df[col].str.strip().str.title()\n            \n    # 5. Handle numeric columns\n    numeric_cols = ['quantity', 'price']\n    stats['imputed_values'] = {}\n    for col in numeric_cols:\n        if col in df.columns:\n            # Save count of missing\n            missing_count = df[col].isna().sum()\n            stats['imputed_values'][col] = int(missing_count)\n            if missing_count > 0:\n                # Convert to numeric\n                df[col] = pd.to_numeric(df[col], errors='coerce')\n                # Impute missing values with median\n                median_val = df[col].median()\n                if pd.isna(median_val):\n                    median_val = 0.0\n                df[col] = df[col].fillna(median_val)\n            else:\n                df[col] = pd.to_numeric(df[col], errors='coerce')\n                \n    stats['final_rows'] = len(df)\n    return df, stats\n",
            "reporter.py": "import pandas as pd\nimport numpy as np\nimport io\nfrom typing import Dict, Any, Tuple\n\ndef detect_anomalies(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Identifies and flags anomalies in the dataset:\n    - Negative or zero quantities\n    - Negative or zero prices\n    - Outlier prices (using 1.5 * IQR method)\n    \n    Adds:\n    - 'is_anomaly': boolean flag\n    - 'anomaly_reason': string detailing why it's flagged, or empty\n    \"\"\"\n    df = df.copy()\n    df['is_anomaly'] = False\n    df['anomaly_reason'] = \"\"\n    \n    reasons = []\n    \n    # 1. Negative/zero quantity\n    if 'quantity' in df.columns:\n        q_cond = df['quantity'] <= 0\n        df.loc[q_cond, 'is_anomaly'] = True\n        df.loc[q_cond, 'anomaly_reason'] = df.loc[q_cond, 'anomaly_reason'].apply(\n            lambda x: (x + \"; \" if x else \"\") + \"Non-positive Quantity\"\n        )\n        \n    # 2. Negative/zero price\n    if 'price' in df.columns:\n        p_cond = df['price'] <= 0\n        df.loc[p_cond, 'is_anomaly'] = True\n        df.loc[p_cond, 'anomaly_reason'] = df.loc[p_cond, 'anomaly_reason'].apply(\n            lambda x: (x + \"; \" if x else \"\") + \"Non-positive Price\"\n        )\n        \n        # 3. IQR outlier prices (calculated on positive prices to avoid skew)\n        pos_prices = df.loc[df['price'] > 0, 'price']\n        if len(pos_prices) > 4:\n            q1 = pos_prices.quantile(0.25)\n            q3 = pos_prices.quantile(0.75)\n            iqr = q3 - q1\n            lower_bound = q1 - 1.5 * iqr\n            upper_bound = q3 + 1.5 * iqr\n            \n            outlier_cond = (df['price'] > upper_bound) | (df['price'] < lower_bound)\n            # Only flag as outlier if it wasn't already flagged as non-positive\n            outlier_cond = outlier_cond & (df['price'] > 0)\n            \n            df.loc[outlier_cond, 'is_anomaly'] = True\n            df.loc[outlier_cond, 'anomaly_reason'] = df.loc[outlier_cond, 'anomaly_reason'].apply(\n                lambda x: (x + \"; \" if x else \"\") + f\"Price Outlier (> {upper_bound:.2f} or < {lower_bound:.2f})\"\n            )\n            \n    return df\n\ndef generate_summary_report(df: pd.DataFrame) -> Dict[str, Any]:\n    \"\"\"\n    Generates summary metrics and grouped analysis DataFrames.\n    \"\"\"\n    report = {}\n    \n    # Calculate revenue if columns exist\n    if 'quantity' in df.columns and 'price' in df.columns:\n        df = df.copy()\n        df['revenue'] = df['quantity'] * df['price']\n        \n        report['total_revenue'] = float(df['revenue'].sum())\n        report['total_units'] = int(df['quantity'].sum())\n        report['avg_unit_price'] = float(df['price'].mean())\n        report['total_transactions'] = len(df)\n        \n        # Group by category\n        if 'category' in df.columns:\n            cat_summary = df.groupby('category').agg(\n                total_revenue=('revenue', 'sum'),\n                units_sold=('quantity', 'sum'),\n                avg_price=('price', 'mean'),\n                transactions=('product', 'count')\n            ).reset_index()\n            # Format numbers to be clean\n            cat_summary['total_revenue'] = cat_summary['total_revenue'].round(2)\n            cat_summary['avg_price'] = cat_summary['avg_price'].round(2)\n            report['category_summary'] = cat_summary\n            \n        # Group by date\n        date_cols = [col for col in df.columns if 'date' in col]\n        if date_cols:\n            date_col = date_cols[0]\n            date_summary = df.groupby(date_col).agg(\n                total_revenue=('revenue', 'sum'),\n                units_sold=('quantity', 'sum'),\n                transactions=('product', 'count')\n            ).reset_index().sort_values(by=date_col)\n            date_summary['total_revenue'] = date_summary['total_revenue'].round(2)\n            report['date_summary'] = date_summary\n            \n    return report\n\ndef export_to_excel(cleaned_df: pd.DataFrame, anomalies_df: pd.DataFrame, report: Dict[str, Any]) -> io.BytesIO:\n    \"\"\"\n    Generates an Excel workbook in memory with multiple sheets:\n    - Cleaned Data\n    - Anomalies\n    - Summary Report (KPIs and groupings)\n    \"\"\"\n    buffer = io.BytesIO()\n    \n    with pd.ExcelWriter(buffer, engine='openpyxl') as writer:\n        # Write cleaned data\n        cleaned_df.to_excel(writer, sheet_name='Cleaned Data', index=False)\n        \n        # Write anomalies\n        anomalies_df.to_excel(writer, sheet_name='Anomalies Flagged', index=False)\n        \n        # Build a summary sheet manually\n        summary_rows = [\n            [\"Metric\", \"Value\"],\n            [\"Total Revenue\", report.get('total_revenue', 0.0)],\n            [\"Total Units Sold\", report.get('total_units', 0)],\n            [\"Average Unit Price\", report.get('avg_unit_price', 0.0)],\n            [\"Total Transactions\", report.get('total_transactions', 0)]\n        ]\n        summary_df = pd.DataFrame(summary_rows[1:], columns=summary_rows[0])\n        summary_df.to_excel(writer, sheet_name='Summary Overview', index=False)\n        \n        if 'category_summary' in report:\n            report['category_summary'].to_excel(writer, sheet_name='Category Breakdown', index=False)\n            \n        if 'date_summary' in report:\n            report['date_summary'].to_excel(writer, sheet_name='Daily Breakdown', index=False)\n            \n    buffer.seek(0)\n    return buffer\n",
            "app.py": "import streamlit as st\nimport pandas as pd\nimport plotly.express as px\nimport plotly.graph_objects as go\nimport io\nimport os\nfrom cleaner import clean_data\nfrom reporter import detect_anomalies, generate_summary_report, export_to_excel\n\n# 1. Page Configuration\nst.set_page_config(\n    page_title=\"DataPulse Dashboard\",\n    page_icon=\"\u26a1\",\n    layout=\"wide\",\n    initial_sidebar_state=\"collapsed\",\n)\n\n# 2. Theme Toggle Pattern\nif \"theme\" not in st.session_state:\n    st.session_state.theme = \"light\"  # Default to Light Mode\n\ndef toggle_theme():\n    st.session_state.theme = \"dark\" if st.session_state.theme == \"light\" else \"light\"\n\nIS_DARK = st.session_state.theme == \"dark\"\n\n# Define CSS custom properties\nbg = \"#09090b\" if IS_DARK else \"#ffffff\"\nbg_subtle = \"#0c0c0f\" if IS_DARK else \"#f9fafb\"\ncard = \"#0c0c0f\" if IS_DARK else \"#ffffff\"\ncard_hover = \"#131316\" if IS_DARK else \"#f4f4f5\"\nborder = \"#1e1e24\" if IS_DARK else \"#e4e4e7\"\nborder_subtle = \"#16161a\" if IS_DARK else \"#f0f0f2\"\ntext = \"#fafafa\" if IS_DARK else \"#09090b\"\ntext_muted = \"#a1a1aa\" if IS_DARK else \"#71717a\"\ntext_dim = \"#71717a\" if IS_DARK else \"#a1a1aa\"\naccent = \"#2563eb\"\ngreen = \"#22c55e\" if IS_DARK else \"#16a34a\"\ngreen_muted = \"rgba(34,197,94,0.12)\" if IS_DARK else \"rgba(22,163,74,0.08)\"\nred = \"#ef4444\" if IS_DARK else \"#dc2626\"\nred_muted = \"rgba(239,68,68,0.12)\" if IS_DARK else \"rgba(220,38,38,0.08)\"\namber = \"#f59e0b\" if IS_DARK else \"#d97706\"\namber_muted = \"rgba(245,158,11,0.12)\" if IS_DARK else \"rgba(217,119,6,0.08)\"\nshadow = \"none\" if IS_DARK else \"0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03)\"\n\ncss_styles = f\"\"\"\n<style>\n    :root {{\n        --bg: {bg};\n        --bg-subtle: {bg_subtle};\n        --card: {card};\n        --card-hover: {card_hover};\n        --border: {border};\n        --border-subtle: {border_subtle};\n        --text: {text};\n        --text-muted: {text_muted};\n        --text-dim: {text_dim};\n        --accent: {accent};\n        --green: {green};\n        --green-muted: {green_muted};\n        --red: {red};\n        --red-muted: {red_muted};\n        --amber: {amber};\n        --amber-muted: {amber_muted};\n        --shadow: {shadow};\n        --radius: 10px;\n    }}\n    \n    /* Hide Streamlit chrome */\n    header[data-testid=\"stHeader\"], #MainMenu, footer, [data-testid=\"stToolbar\"],\n    [data-testid=\"stDecoration\"], [data-testid=\"stStatusWidget\"], .stDeployButton,\n    div[data-testid=\"stSidebarCollapsedControl\"] {{\n        display: none !important;\n    }}\n    \n    /* Global App Styling */\n    html, body, [data-testid=\"stAppViewContainer\"], [data-testid=\"stApp\"], .main, .block-container, section[data-testid=\"stMain\"] {{\n        background-color: var(--bg) !important;\n        color: var(--text) !important;\n        font-family: 'DM Sans', -apple-system, sans-serif !important;\n    }}\n    .block-container {{\n        padding: 2rem 2.5rem 3rem !important;\n        max-width: 1360px !important;\n    }}\n    \n    /* Force all text/labels to use our color variable to fix Dark Mode visibility */\n    p, span, label, h1, h2, h3, h4, h5, h6, \n    [data-testid=\"stMarkdownContainer\"] p, \n    [data-testid=\"stWidgetLabel\"] p, \n    div[class*=\"stMarkdown\"] p,\n    div[data-testid=\"stFileUploaderDropzone\"] span,\n    button[data-baseweb=\"tab\"] span {{\n        color: var(--text) !important;\n    }}\n    \n    /* Small help text/file requirements text */\n    small, div[data-testid=\"stCaptionContainer\"] {{\n        color: var(--text-muted) !important;\n    }}\n    \n    /* Brand Header styling */\n    .brand {{\n        display: flex;\n        flex-direction: column;\n        margin-bottom: 1.5rem;\n    }}\n    .brand-name {{\n        font-size: 1.8rem;\n        font-weight: 800;\n        letter-spacing: -0.04em;\n        color: var(--text);\n    }}\n    .brand-sub {{\n        font-size: 0.85rem;\n        color: var(--text-muted);\n    }}\n    \n    /* KPI Card styling */\n    .metric-card {{\n        background: var(--card);\n        border: 1px solid var(--border);\n        border-radius: var(--radius);\n        padding: 1.25rem 1.4rem;\n        box-shadow: var(--shadow);\n        display: flex;\n        flex-direction: column;\n        justify-content: space-between;\n        min-height: 100px;\n    }}\n    .metric-label {{\n        font-size: 0.78rem;\n        color: var(--text-muted) !important;\n        font-weight: 500;\n        text-transform: uppercase;\n        letter-spacing: 0.05em;\n    }}\n    .metric-value {{\n        font-size: 1.75rem;\n        font-weight: 700;\n        color: var(--text) !important;\n        letter-spacing: -0.03em;\n        margin-top: 0.3rem;\n    }}\n    .metric-delta {{\n        font-size: 0.75rem;\n        font-weight: 500;\n        margin-top: 0.4rem;\n        padding: 2px 8px;\n        border-radius: 6px;\n        display: inline-flex;\n        align-items: center;\n        gap: 3px;\n        align-self: flex-start;\n    }}\n    .delta-up {{ color: var(--green) !important; background: var(--green-muted); }}\n    .delta-down {{ color: var(--red) !important; background: var(--red-muted); }}\n    .delta-warn {{ color: var(--amber) !important; background: var(--amber-muted); }}\n    \n    /* Chart Wrap styling */\n    .chart-wrap {{\n        background: var(--card);\n        border: 1px solid var(--border);\n        border-radius: var(--radius);\n        padding: 1.2rem;\n        box-shadow: var(--shadow);\n        margin-bottom: 1.25rem;\n    }}\n    .chart-title {{\n        font-size: 0.88rem;\n        font-weight: 600;\n        color: var(--text) !important;\n    }}\n    .chart-subtitle {{\n        font-size: 0.75rem;\n        color: var(--text-dim) !important;\n        margin-bottom: 0.8rem;\n    }}\n    \n    /* Data Table (HTML) styling */\n    .table-container {{\n        overflow-x: auto;\n        border: 1px solid var(--border);\n        border-radius: var(--radius);\n        background: var(--card);\n        padding: 0.5rem;\n        margin-bottom: 1.5rem;\n    }}\n    .data-table {{\n        width: 100%;\n        border-collapse: separate;\n        border-spacing: 0;\n        font-size: 0.8rem;\n    }}\n    .data-table th {{\n        text-align: left;\n        padding: 0.6rem 0.8rem;\n        color: var(--text-muted) !important;\n        font-weight: 500;\n        font-size: 0.72rem;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n        border-bottom: 1px solid var(--border);\n    }}\n    .data-table td {{\n        padding: 0.65rem 0.8rem;\n        color: var(--text) !important;\n        border-bottom: 1px solid var(--border-subtle);\n    }}\n    .data-table tr:last-child td {{\n        border-bottom: none;\n    }}\n    \n    /* Badges */\n    .badge {{\n        display: inline-block;\n        padding: 2px 9px;\n        border-radius: 6px;\n        font-size: 0.72rem;\n        font-weight: 500;\n    }}\n    .badge-green {{ color: var(--green) !important; background: var(--green-muted); }}\n    .badge-red {{ color: var(--red) !important; background: var(--red-muted); }}\n    .badge-amber {{ color: var(--amber) !important; background: var(--amber-muted); }}\n    .badge-blue {{ color: var(--accent) !important; background: rgba(37,99,235,0.1); }}\n    \n    /* Tabs (pill-style) styling */\n    button[data-baseweb=\"tab\"] {{\n        background: transparent !important;\n        color: var(--text-muted) !important;\n        font-size: 0.835rem !important;\n        font-weight: 500 !important;\n        padding: 0.55rem 1rem !important;\n        border: 1px solid transparent !important;\n        border-radius: 7px !important;\n    }}\n    button[data-baseweb=\"tab\"][aria-selected=\"true\"] {{\n        color: var(--text) !important;\n        background: var(--card) !important;\n        border-color: var(--border) !important;\n    }}\n    [data-baseweb=\"tab-highlight\"], [data-baseweb=\"tab-border\"] {{\n        display: none !important;\n    }}\n    [data-baseweb=\"tab-list\"] {{\n        gap: 4px !important;\n        background: var(--bg-subtle) !important;\n        border: 1px solid var(--border) !important;\n        border-radius: 10px !important;\n        padding: 3px;\n        margin-bottom: 1.5rem;\n    }}\n    \n    [data-testid=\"stHorizontalBlock\"] {{ gap: 1.25rem !important; }}\n</style>\n\"\"\"\nst.markdown(css_styles, unsafe_allow_html=True)\n\n# 3. Define UI Helpers\ndef metric_card(label, value, delta=None, delta_type=\"up\"):\n    cls = f\"delta-{delta_type}\"\n    arrow = \"\u2191\" if delta_type == \"up\" else (\"\u2193\" if delta_type == \"down\" else \"\u2192\")\n    delta_html = f'<div class=\"metric-delta {cls}\">{arrow} {delta}</div>' if delta else \"\"\n    st.markdown(f\"\"\"\n    <div class=\"metric-card\">\n        <div class=\"metric-label\">{label}</div>\n        <div class=\"metric-value\">{value}</div>\n        {delta_html}\n    </div>\n    \"\"\", unsafe_allow_html=True)\n\ndef render_html_table(df, max_rows=15):\n    df_slice = df.head(max_rows)\n    cols = df_slice.columns\n    header_html = \"\".join([f\"<th>{col.upper()}</th>\" for col in cols])\n    \n    rows_html = \"\"\n    for idx, row in df_slice.iterrows():\n        row_cells = \"\"\n        for col in cols:\n            val = row[col]\n            if isinstance(val, float):\n                row_cells += f\"<td>{val:.2f}</td>\"\n            elif col == 'anomaly_reason' and pd.notna(val) and val != \"\":\n                # Split multiple reasons\n                reasons = [r.strip() for r in str(val).split(\";\")]\n                badges = \"\".join([f'<span class=\"badge badge-red\" style=\"margin-right: 4px;\">{r}</span>' for r in reasons])\n                row_cells += f'<td>{badges}</td>'\n            elif col == 'is_anomaly':\n                badge_class = \"badge-red\" if val else \"badge-green\"\n                badge_text = \"Yes\" if val else \"No\"\n                row_cells += f'<td><span class=\"badge {badge_class}\">{badge_text}</span></td>'\n            else:\n                row_cells += f\"<td>{str(val)}</td>\"\n        rows_html += f\"<tr>{row_cells}</tr>\"\n        \n    return f\"\"\"\n    <div class=\"table-container\">\n        <table class=\"data-table\">\n            <thead><tr>{header_html}</tr></thead>\n            <tbody>{rows_html}</tbody>\n        </table>\n    </div>\n    \"\"\"\n\n# 4. Header Section\nhead_left, head_right = st.columns([8, 1.5])\nwith head_left:\n    st.markdown(\"\"\"\n    <div class=\"brand\">\n        <span class=\"brand-name\">\u26a1 DataPulse</span>\n        <span class=\"brand-sub\">Modern CSV Cleaning & Reporting Platform</span>\n    </div>\n    \"\"\", unsafe_allow_html=True)\nwith head_right:\n    theme_label = \"\u2600\ufe0f Light Mode\" if IS_DARK else \"\ud83c\udf19 Dark Mode\"\n    st.button(theme_label, on_click=toggle_theme, use_container_width=True)\n\n# 5. Core Session State\nif \"raw_df\" not in st.session_state:\n    st.session_state.raw_df = None\nif \"cleaned_df\" not in st.session_state:\n    st.session_state.cleaned_df = None\nif \"anomalies_df\" not in st.session_state:\n    st.session_state.anomalies_df = None\nif \"stats\" not in st.session_state:\n    st.session_state.stats = None\nif \"report\" not in st.session_state:\n    st.session_state.report = None\n\n# Navigation Tabs\ntab1, tab2, tab3 = st.tabs([\"\u26a1 Upload & Clean\", \"\ud83d\udcca Analytics Dashboard\", \"\u26a0\ufe0f Anomaly Log\"])\n\n# 6. Tab 1: Upload & Clean\nwith tab1:\n    col_upload_left, col_upload_right = st.columns([3, 2])\n    \n    with col_upload_left:\n        st.markdown(\"### \ud83d\udce5 Source Dataset\")\n        uploaded_file = st.file_uploader(\"Upload CSV sales or inventory data file\", type=[\"csv\"], help=\"Must contain column fields such as date, product, category, quantity, price\")\n        \n        # Load Sample Button\n        if st.button(\"\ud83d\udca1 Load Sample CSV Dataset (Demo)\", use_container_width=True):\n            sample_path = \"sample_data.csv\"\n            if os.path.exists(sample_path):\n                st.session_state.raw_df = pd.read_csv(sample_path)\n                st.toast(\"Loaded sample dataset successfully!\")\n            else:\n                st.error(\"Sample dataset file not found.\")\n\n    with col_upload_right:\n        st.markdown(\"### \u2699\ufe0f Pipeline Status\")\n        if uploaded_file is not None:\n            st.session_state.raw_df = pd.read_csv(uploaded_file)\n            st.success(\"File uploaded successfully!\")\n            \n        if st.session_state.raw_df is not None:\n            if st.button(\"\ud83d\ude80 Run Data Cleaning & Report Pipeline\", type=\"primary\", use_container_width=True):\n                with st.spinner(\"Processing data cleanings, normalization & anomaly detection...\"):\n                    # Process Cleaning\n                    clean_df, stats = clean_data(st.session_state.raw_df.copy())\n                    \n                    # Detect Anomalies\n                    anom_df = detect_anomalies(clean_df)\n                    \n                    # Generate report aggregates on the clean records (non-anomalous if preferred, but let's do overall clean records)\n                    # We will calculate summaries on non-anomalous rows for accurate business reporting\n                    clean_reports_df = anom_df[~anom_df['is_anomaly']]\n                    report = generate_summary_report(clean_reports_df)\n                    \n                    # Store to session state\n                    st.session_state.cleaned_df = clean_df\n                    st.session_state.anomalies_df = anom_df\n                    st.session_state.stats = stats\n                    st.session_state.report = report\n                    st.toast(\"Pipeline executed successfully!\")\n\n    if st.session_state.stats is not None:\n        st.markdown(\"---\")\n        st.markdown(\"### \ud83d\udcc8 Processing Metrics\")\n        \n        # Row metrics\n        mc1, mc2, mc3, mc4 = st.columns(4)\n        with mc1:\n            metric_card(\"Original Rows\", f\"{st.session_state.stats['initial_rows']}\")\n        with mc2:\n            metric_card(\"Duplicates Dropped\", f\"{st.session_state.stats['duplicates_removed']}\", delta_type=\"down\" if st.session_state.stats['duplicates_removed'] > 0 else \"neutral\")\n        with mc3:\n            total_anoms = int(st.session_state.anomalies_df['is_anomaly'].sum())\n            metric_card(\"Anomalies Flagged\", f\"{total_anoms}\", delta_type=\"warn\" if total_anoms > 0 else \"neutral\")\n        with mc4:\n            metric_card(\"Final Clean Rows\", f\"{st.session_state.stats['final_rows']}\")\n            \n        # Preview Tables\n        st.markdown(\"### \ud83d\udd0d Dataset Previews\")\n        prev_tab1, prev_tab2 = st.tabs([\"Cleaned & Flagged Data Preview\", \"Raw Uploaded Data Preview\"])\n        \n        with prev_tab1:\n            st.markdown(\"<p style='font-size: 0.8rem; color: var(--text-muted);'>Showing top 15 cleaned records with anomaly flags:</p>\", unsafe_allow_html=True)\n            st.markdown(render_html_table(st.session_state.anomalies_df, 15), unsafe_allow_html=True)\n            \n            # Export downloads\n            st.markdown(\"#### \ud83d\udce5 Download Exports\")\n            d_col1, d_col2 = st.columns(2)\n            with d_col1:\n                # CSV Export\n                csv_buffer = io.StringIO()\n                st.session_state.anomalies_df.to_csv(csv_buffer, index=False)\n                st.download_button(\n                    label=\"\ud83d\udcc4 Download Cleaned Data (CSV)\",\n                    data=csv_buffer.getvalue(),\n                    file_name=\"cleaned_datapulse_export.csv\",\n                    mime=\"text/csv\",\n                    use_container_width=True\n                )\n            with d_col2:\n                # Excel Export\n                excel_buffer = export_to_excel(\n                    st.session_state.cleaned_df,\n                    st.session_state.anomalies_df,\n                    st.session_state.report\n                )\n                st.download_button(\n                    label=\"\ud83d\udcca Download Full Multi-Sheet Report (Excel)\",\n                    data=excel_buffer,\n                    file_name=\"datapulse_analysis_report.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    use_container_width=True\n                )\n                \n        with prev_tab2:\n            st.markdown(\"<p style='font-size: 0.8rem; color: var(--text-muted);'>Showing top 15 records of raw data:</p>\", unsafe_allow_html=True)\n            st.markdown(render_html_table(st.session_state.raw_df, 15), unsafe_allow_html=True)\n    else:\n        st.markdown(\"---\")\n        st.info(\"Please upload a CSV file or load the sample dataset, then click 'Run Data Cleaning & Report Pipeline' to start.\")\n\n# 7. Tab 2: Analytics Dashboard\nwith tab2:\n    if st.session_state.report is not None:\n        st.markdown(\"### \ud83d\udcca Business KPI Insights\")\n        st.markdown(\"<p style='font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem;'>Aggregates computed excluding anomalous transaction records.</p>\", unsafe_allow_html=True)\n        \n        rep = st.session_state.report\n        \n        # KPI Row\n        rc1, rc2, rc3, rc4 = st.columns(4)\n        with rc1:\n            metric_card(\"Total Net Revenue\", f\"${rep.get('total_revenue', 0.0):,.2f}\")\n        with rc2:\n            metric_card(\"Total Units Sold\", f\"{rep.get('total_units', 0):,}\")\n        with rc3:\n            metric_card(\"Avg Item Unit Price\", f\"${rep.get('avg_unit_price', 0.0):,.2f}\")\n        with rc4:\n            metric_card(\"Valid Transactions\", f\"{rep.get('total_transactions', 0):,}\")\n            \n        st.markdown(\"---\")\n        \n        # Plotly theme setup\n        PLOT_LAYOUT = dict(\n            paper_bgcolor=\"rgba(0,0,0,0)\",\n            plot_bgcolor=\"rgba(0,0,0,0)\",\n            font=dict(family=\"DM Sans, sans-serif\", color=\"#71717a\" if not IS_DARK else \"#a1a1aa\", size=11),\n            margin=dict(l=40, r=20, t=20, b=40),\n            xaxis=dict(\n                gridcolor=\"rgba(0,0,0,0.06)\" if not IS_DARK else \"rgba(255,255,255,0.06)\",\n                zerolinecolor=\"rgba(0,0,0,0.06)\" if not IS_DARK else \"rgba(255,255,255,0.06)\",\n                tickfont=dict(size=10, color=\"#71717a\"),\n            ),\n            yaxis=dict(\n                gridcolor=\"rgba(0,0,0,0.06)\" if not IS_DARK else \"rgba(255,255,255,0.06)\",\n                zerolinecolor=\"rgba(0,0,0,0.06)\" if not IS_DARK else \"rgba(255,255,255,0.06)\",\n                tickfont=dict(size=10, color=\"#71717a\"),\n            ),\n        )\n        \n        chart_col1, chart_col2 = st.columns(2)\n        \n        with chart_col1:\n            st.markdown(\"\"\"\n            <div class=\"chart-wrap\">\n                <div class=\"chart-title\">Revenue Trends over Time</div>\n                <div class=\"chart-subtitle\">Daily aggregate net sales revenue</div>\n            \"\"\", unsafe_allow_html=True)\n            \n            if 'date_summary' in rep and not rep['date_summary'].empty:\n                df_date = rep['date_summary']\n                date_col = df_date.columns[0]\n                fig = px.line(\n                    df_date, \n                    x=date_col, \n                    y='total_revenue',\n                    markers=True,\n                    template=\"plotly_dark\" if IS_DARK else \"plotly_white\"\n                )\n                fig.update_traces(line=dict(color=accent, width=2.5), marker=dict(size=6, color=accent))\n                fig.update_layout(**PLOT_LAYOUT)\n                st.plotly_chart(fig, use_container_width=True, config={\"displayModeBar\": False})\n            else:\n                st.info(\"No date columns or data found for trend analysis.\")\n            st.markdown(\"</div>\", unsafe_allow_html=True)\n            \n        with chart_col2:\n            st.markdown(\"\"\"\n            <div class=\"chart-wrap\">\n                <div class=\"chart-title\">Category Revenue Contribution</div>\n                <div class=\"chart-subtitle\">Distribution of net sales revenue by product category</div>\n            \"\"\", unsafe_allow_html=True)\n            \n            if 'category_summary' in rep and not rep['category_summary'].empty:\n                df_cat = rep['category_summary']\n                fig = px.bar(\n                    df_cat,\n                    x='category',\n                    y='total_revenue',\n                    color='category',\n                    color_discrete_sequence=px.colors.qualitative.Bold,\n                    template=\"plotly_dark\" if IS_DARK else \"plotly_white\"\n                )\n                fig.update_layout(**PLOT_LAYOUT, showlegend=False)\n                st.plotly_chart(fig, use_container_width=True, config={\"displayModeBar\": False})\n            else:\n                st.info(\"No category summary data found.\")\n            st.markdown(\"</div>\", unsafe_allow_html=True)\n            \n        # Additional visual tables\n        st.markdown(\"### \ud83d\uddc2\ufe0f Category Performance Ledger\")\n        if 'category_summary' in rep:\n            st.markdown(render_html_table(rep['category_summary'], 10), unsafe_allow_html=True)\n    else:\n        st.info(\"No pipeline calculations present. Please run the data pipeline in the 'Upload & Clean' tab first.\")\n\n# 8. Tab 3: Anomaly Log\nwith tab3:\n    if st.session_state.anomalies_df is not None:\n        anoms = st.session_state.anomalies_df[st.session_state.anomalies_df['is_anomaly']]\n        \n        st.markdown(\"### \u26a0\ufe0f Flagged Anomalies Log\")\n        st.markdown(f\"<p style='font-size: 0.8rem; color: var(--text-muted);'>Found {len(anoms)} transactions with pricing/quantity flags or statistical outliers.</p>\", unsafe_allow_html=True)\n        \n        if not anoms.empty:\n            st.markdown(render_html_table(anoms, 50), unsafe_allow_html=True)\n        else:\n            st.success(\"No anomalies detected in this dataset!\")\n    else:\n        st.info(\"No anomalies analyzed. Please process a dataset in the 'Upload & Clean' tab first.\")\n",
            "sample_data.csv": "date,product,category,quantity,price\n2026-08-01,apples,Fruits,10,1.20\n08/02/2026,APPLES,FRUITS,12,1.20\n2026/08/03,Bananas,fruits,15,0.80\n2026-08-04,bananas,fruits,15,0.80\n05-Aug-2026,Cherries,Fruits,8,3.00\n2026-08-06,apples,Fruits,-5,1.20\n2026-08-07,Oranges,,20,1.50\n2026-08-08,Bananas,Fruits,,0.80\n2026-08-09,Peaches,Fruits,10,\n2026-08-10,Pineapple,Fruits,2,999.00\n2026-08-11,apples,Fruits,10,1.20\n2026-08-11,apples,Fruits,10,1.20\n2026-08-12,Carrots,Vegetables,30,0.50\n2026-08-13,Broccoli,Vegetables,25,1.80\n2026-08-14,spinach,VEGETABLES,15,-0.90\n"
          },
        },
        document.getElementById("root")
      );
